databaseChangeLog:

  # =====================================================================
  # 701-710: REFERENCE / LOOKUP TABLES + ZAPOSLENI ADDITIONS
  # =====================================================================

  - changeSet:
      id: 701-create-vehicle-type
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_type
      changes:
        - createTable:
            tableName: vehicle_type
            columns:
              - column:
                  name: id_vehicle_type
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: 702-create-vehicle-subtype
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_subtype
      changes:
        - createTable:
            tableName: vehicle_subtype
            columns:
              - column:
                  name: id_vehicle_subtype
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 703-create-tire-marking
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: tire_marking
      changes:
        - createTable:
            tableName: tire_marking
            columns:
              - column:
                  name: id_tire_marking
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: marking
                  type: VARCHAR(100)

  - changeSet:
      id: 704-create-travel-order-type
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: travel_order_type
      changes:
        - createTable:
            tableName: travel_order_type
            columns:
              - column:
                  name: id_travel_order_type
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 705-add-organizational-unit-to-zaposleni
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: zaposleni
            columnName: organizational_unit
      changes:
        - addColumn:
            tableName: zaposleni
            columns:
              - column:
                  name: organizational_unit
                  type: VARCHAR(100)

  - changeSet:
      id: 706-add-job-grade-to-zaposleni
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: zaposleni
            columnName: job_grade
      changes:
        - addColumn:
            tableName: zaposleni
            columns:
              - column:
                  name: job_grade
                  type: VARCHAR(50)

  - changeSet:
      id: 707-add-manager-id-to-zaposleni
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: zaposleni
            columnName: manager_id
      changes:
        - addColumn:
            tableName: zaposleni
            columns:
              - column:
                  name: manager_id
                  type: BIGINT

  - changeSet:
      id: 708-fk-zaposleni-manager-self
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          foreignKeyConstraintExists:
            foreignKeyName: fk_zaposleni_manager
      changes:
        - addForeignKeyConstraint:
            baseTableName: zaposleni
            baseColumnNames: manager_id
            constraintName: fk_zaposleni_manager
            referencedTableName: zaposleni
            referencedColumnNames: ID_ZAPOSLENI

  # =====================================================================
  # 711-720: NEW VEHICLE DOCUMENT TABLES
  # =====================================================================

  - changeSet:
      id: 711-create-casco-insurance
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: casco_insurance
      changes:
        - createTable:
            tableName: casco_insurance
            columns:
              - column:
                  name: id_casco_insurance
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: contract_number
                  type: VARCHAR(30)
              - column:
                  name: policy_number
                  type: VARCHAR(30)
              - column:
                  name: date_from
                  type: DATE
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 712-create-tachograph-device
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: tachograph_device
      changes:
        - createTable:
            tableName: tachograph_device
            columns:
              - column:
                  name: id_tachograph_device
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: device_type
                  type: VARCHAR(30)
              - column:
                  name: serial_number
                  type: VARCHAR(50)
              - column:
                  name: date_from
                  type: DATE
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 713-create-fire-extinguisher
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: fire_extinguisher
      changes:
        - createTable:
            tableName: fire_extinguisher
            columns:
              - column:
                  name: id_fire_extinguisher
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: serial_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: date_from
                  type: DATE
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 714-create-nis-card
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: nis_card
      changes:
        - createTable:
            tableName: nis_card
            columns:
              - column:
                  name: id_nis_card
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

  - changeSet:
      id: 715-create-vehicle-document
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_document
      changes:
        - createTable:
            tableName: vehicle_document
            columns:
              - column:
                  name: id_vehicle_document
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: document_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                  remarks: "TRAFFIC_LICENSE, CERTIFICATE, EXPERT_FINDING"
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: storage_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: upload_date
                  type: DATE
                  defaultValueComputed: "(CURRENT_DATE)"
              - column:
                  name: uploaded_by_user_id
                  type: BIGINT
              - column:
                  name: notes
                  type: VARCHAR(300)

  - changeSet:
      id: 716-create-registration-change-log
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: registration_change_log
      changes:
        - createTable:
            tableName: registration_change_log
            columns:
              - column:
                  name: id_registration_change_log
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: old_registration_number
                  type: VARCHAR(20)
              - column:
                  name: new_registration_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: change_reason
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "1=Re-registration, 2=Error correction, 3=Other"
              - column:
                  name: change_note
                  type: VARCHAR(300)
                  remarks: "Populated only when change_reason = 3"
              - column:
                  name: change_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: changed_by_user_id
                  type: BIGINT

  # =====================================================================
  # 717-720: VEHICLE FAULT AND TRAFFIC ACCIDENT
  # =====================================================================

  - changeSet:
      id: 717-create-vehicle-fault
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_fault
      changes:
        - createTable:
            tableName: vehicle_fault
            columns:
              - column:
                  name: id_vehicle_fault
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: report_date
                  type: DATE
              - column:
                  name: location_id
                  type: BIGINT
              - column:
                  name: reported_by_driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: mileage_at_fault
                  type: INT
              - column:
                  name: fault_description
                  type: VARCHAR(1000)
              - column:
                  name: tow_required
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: "0=no, 1=yes"
              - column:
                  name: handover_driver_id
                  type: BIGINT
              - column:
                  name: vehicle_inoperable
                  type: TINYINT
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0
                  remarks: "1=changes vehicle status to IN_FAULT"
              - column:
                  name: service_type
                  type: VARCHAR(10)
                  remarks: "MINOR or MAJOR for scheduled services, NULL for ordinary faults"
              - column:
                  name: resolution_date
                  type: DATE
              - column:
                  name: handover_date
                  type: DATE
              - column:
                  name: created_by_user_id
                  type: BIGINT
              - column:
                  name: signature
                  type: TEXT
                  remarks: "Base64-encoded PNG signature image"

  - changeSet:
      id: 718-create-traffic-accident
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: traffic_accident
      changes:
        - createTable:
            tableName: traffic_accident
            columns:
              - column:
                  name: id_traffic_accident
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: accident_date
                  type: DATE
              - column:
                  name: accident_time
                  type: VARCHAR(10)
              - column:
                  name: location_description
                  type: VARCHAR(200)
              - column:
                  name: accident_description
                  type: VARCHAR(2000)
              - column:
                  name: damage_description
                  type: VARCHAR(1000)
              - column:
                  name: reported_to_police
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: "0=no, 1=yes"
              - column:
                  name: not_reported_reason
                  type: VARCHAR(500)
              - column:
                  name: estimated_damage_value
                  type: DECIMAL(15,2)
              - column:
                  name: driver_id
                  type: BIGINT
              - column:
                  name: driver_license_number_snapshot
                  type: VARCHAR(30)
              - column:
                  name: driver_license_expiry_snapshot
                  type: DATE
              - column:
                  name: statement_given_by_driver_id
                  type: BIGINT
              - column:
                  name: location_id
                  type: BIGINT
              - column:
                  name: travel_order_number_snapshot
                  type: VARCHAR(30)
              - column:
                  name: other_participants
                  type: VARCHAR(1000)
              - column:
                  name: declarant_national_id
                  type: VARCHAR(13)
              - column:
                  name: declarant_address
                  type: VARCHAR(200)
              - column:
                  name: declarant_email
                  type: VARCHAR(100)
              - column:
                  name: declarant_position
                  type: VARCHAR(100)
              - column:
                  name: signature
                  type: TEXT
                  remarks: "Base64-encoded PNG signature image"
              - column:
                  name: created_by_user_id
                  type: BIGINT

  # =====================================================================
  # 721-730: NEW COLUMNS ON EXISTING VEHICLE TABLE
  # =====================================================================

  - changeSet:
      id: 721-add-vehicle-physical-columns
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: vehicle
            columnName: mass
      changes:
        - addColumn:
            tableName: vehicle
            columns:
              - column:
                  name: mass
                  type: DECIMAL(10,2)
              - column:
                  name: color
                  type: VARCHAR(20)
              - column:
                  name: load_capacity
                  type: INT
              - column:
                  name: total_mass
                  type: INT
              - column:
                  name: number_of_seats
                  type: INT
              - column:
                  name: first_registration_date
                  type: DATE
              - column:
                  name: operational_leasing
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: "1=vehicle is on operational leasing"
              - column:
                  name: decommissioned
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: "1=vehicle permanently decommissioned, removed from operations"
              - column:
                  name: decommission_date
                  type: DATE
              - column:
                  name: note
                  type: VARCHAR(300)

  - changeSet:
      id: 722-add-vehicle-fk-columns
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: vehicle
            columnName: vehicle_type_id
      changes:
        - addColumn:
            tableName: vehicle
            columns:
              - column:
                  name: vehicle_type_id
                  type: BIGINT
              - column:
                  name: vehicle_subtype_id
                  type: BIGINT
              - column:
                  name: tachograph_device_id
                  type: BIGINT
              - column:
                  name: casco_insurance_id
                  type: BIGINT
              - column:
                  name: fire_extinguisher_id
                  type: BIGINT
                  remarks: "FK to fire_extinguisher table — distinct from legacy fire_extinguisher_serial_number column"
              - column:
                  name: nis_card_id
                  type: BIGINT
              - column:
                  name: tire_marking_id
                  type: BIGINT

  # =====================================================================
  # 731-740: DRIVER DOCUMENT TABLES + DRIVER COLUMNS
  # =====================================================================

  - changeSet:
      id: 731-create-medical-certificate
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: medical_certificate
      changes:
        - createTable:
            tableName: medical_certificate
            columns:
              - column:
                  name: id_medical_certificate
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_from
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 732-create-tachograph-card
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: tachograph_card
      changes:
        - createTable:
            tableName: tachograph_card
            columns:
              - column:
                  name: id_tachograph_card
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_from
                  type: DATE
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 733-create-driver-permit
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: driver_permit
      changes:
        - createTable:
            tableName: driver_permit
            columns:
              - column:
                  name: id_driver_permit
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_from
                  type: DATE
              - column:
                  name: date_to
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: status_code
                  type: INT

  - changeSet:
      id: 734-add-tachograph-card-to-drivers-license
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: drivers_license
            columnName: tachograph_card_id
      changes:
        - addColumn:
            tableName: drivers_license
            columns:
              - column:
                  name: tachograph_card_id
                  type: BIGINT
              - column:
                  name: medical_restrictions
                  type: TINYINT
                  defaultValueNumeric: 0
                  remarks: "1=driver has medical restrictions; date_to already set to the minimum of category-calculated and medical restriction date"

  - changeSet:
      id: 735-add-driver-status-columns
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: driver
            columnName: license_revoked
      changes:
        - addColumn:
            tableName: driver
            columns:
              - column:
                  name: license_revoked
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: "Fast flag: 1=license actively revoked. Source of truth is license_revocation table."
              - column:
                  name: medical_certificate_id
                  type: BIGINT
              - column:
                  name: driver_permit_id
                  type: BIGINT

  - changeSet:
      id: 736-create-license-revocation
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: license_revocation
      changes:
        - createTable:
            tableName: license_revocation
            columns:
              - column:
                  name: id_license_revocation
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: revocation_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: revocation_reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: restoration_date
                  type: DATE
                  remarks: "NULL while revocation is still active"
              - column:
                  name: revoked_by_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: restored_by_user_id
                  type: BIGINT
                  remarks: "NULL until license is restored"

  - changeSet:
      id: 737-enforce-driver-zaposleni-unique
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          uniqueConstraintExists:
            tableName: driver
            constraintName: uq_driver_zaposleni_id
      changes:
        - addUniqueConstraint:
            tableName: driver
            columnNames: ZAPOSLENI_ID
            constraintName: uq_driver_zaposleni_id

  # =====================================================================
  # 741-742: VEHICLE ASSIGNED DRIVER + LOG
  # =====================================================================

  - changeSet:
      id: 741-create-vehicle-assigned-driver
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_assigned_driver
      changes:
        - createTable:
            tableName: vehicle_assigned_driver
            columns:
              - column:
                  name: id_vehicle_assigned_driver
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: assignment_date
                  type: DATE
                  defaultValueComputed: "(CURRENT_DATE)"
              - column:
                  name: note
                  type: VARCHAR(500)

  - changeSet:
      id: 742-unique-vehicle-assigned-driver-vehicle
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          uniqueConstraintExists:
            tableName: vehicle_assigned_driver
            constraintName: uq_vehicle_assigned_driver_vehicle
      changes:
        - addUniqueConstraint:
            tableName: vehicle_assigned_driver
            columnNames: vehicle_id
            constraintName: uq_vehicle_assigned_driver_vehicle

  - changeSet:
      id: 743-create-vehicle-assigned-driver-log
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: vehicle_assigned_driver_log
      changes:
        - createTable:
            tableName: vehicle_assigned_driver_log
            columns:
              - column:
                  name: id_vehicle_assigned_driver_log
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: previous_driver_id
                  type: BIGINT
              - column:
                  name: new_driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: change_date
                  type: DATE
                  defaultValueComputed: "(CURRENT_DATE)"
                  constraints:
                    nullable: false
              - column:
                  name: changed_by_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

  # =====================================================================
  # 751-755: TRAVEL ORDER EXPANSIONS
  # =====================================================================

  - changeSet:
      id: 751-add-travel-order-type-and-status-code
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: travel_order
            columnName: travel_order_type_id
      changes:
        - addColumn:
            tableName: travel_order
            columns:
              - column:
                  name: travel_order_type_id
                  type: BIGINT
              - column:
                  name: status_code
                  type: INT
                  remarks: "1=ACTIVE, 2=UNFINISHED, 3=COMPLETED, 0=CANCELLED — managed by application service layer, never written directly"

  - changeSet:
      id: 752-create-fuel-receipt
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: fuel_receipt
      changes:
        - createTable:
            tableName: fuel_receipt
            columns:
              - column:
                  name: id_fuel_receipt
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: receipt_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: mileage
                  type: INT
              - column:
                  name: liters
